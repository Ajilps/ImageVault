<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <title>ImageVault is offline</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; background: #f5f7fb; color: #172033; }
      main { width: min(28rem, calc(100% - 3rem)); padding: 2rem; border: 1px solid #e2e8f0; border-radius: 1rem; background: white; box-shadow: 0 1rem 3rem rgb(15 23 42 / 8%); text-align: center; }
      h1 { margin: 0; font-size: 1.5rem; } p { margin: .75rem 0 0; color: #64748b; line-height: 1.5; }
      a { display: inline-block; margin-top: 1.5rem; padding: .7rem 1rem; border-radius: .75rem; background: #4f46e5; color: white; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Reconnect to continue working with your organisation’s images and notifications.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
